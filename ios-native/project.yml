# XcodeGen spec for the native SwiftUI app. Generate the Xcode project with:  cd ios-native && xcodegen generate
name: KosherTravel
options:
  bundleIdPrefix: com.yourkoshertravel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    minVersion: 11.0.0
    maxVersion: 20.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    minVersion: 8.0.0
    maxVersion: 20.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KosherTravel:
    type: application
    platform: iOS
    sources:
      - path: KosherTravel
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
    # Universal links + Sign in with Apple (both enabled on the App ID and carried by the App Store profile).
    entitlements:
      path: KosherTravel/KosherTravel.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:www.yourkoshertravel.com
          - applinks:yourkoshertravel.com
        com.apple.developer.applesignin:
          - Default
    info:
      path: KosherTravel/Info.plist
      properties:
        CFBundleDisplayName: Kosher Travel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Asked only when a screen needs it (photo upload, "use my location" for zmanim and travel times).
        NSCameraUsageDescription: Take photos and videos for the trips you share.
        NSPhotoLibraryUsageDescription: Choose photos and videos from your library to share your trip.
        NSMicrophoneUsageDescription: Record sound with the videos you share, and ask the AI Planner by voice.
        # The AI Planner (the website's chat in the app since Oct 29 2026) has a mic button that uses speech recognition.
        NSSpeechRecognitionUsageDescription: Turn what you say into your question for the AI Planner.
        NSLocationWhenInUseUsageDescription: Show zmanim, nearby kosher places and travel times for where you are.
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1025364088855-p1oc0b55mivbl3sdqcr6of3j0qh656mv
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourkoshertravel.app
        PRODUCT_NAME: KosherTravel
        DEVELOPMENT_TEAM: 46MB33SVM3
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        # Release = the signed TestFlight build (.github/workflows/ios-testflight.yml). Debug/simulator builds are unchanged.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Kosher Travel App Store
    scheme:
      gatherCoverageData: false
